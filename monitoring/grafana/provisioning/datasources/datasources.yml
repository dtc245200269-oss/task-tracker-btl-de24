apiVersion: 1

datasources:
  # 1. Prometheus Datasource (Thu thập Metrics)
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  # 2. Loki Datasource (Thu thập và truy vấn Logs với LogQL)
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
